name: Build main

on: [push, pull_request]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Init
      run: dotnet fsi build.fsx -p Init
    - name: Build
      run: dotnet fsi build.fsx
    - name: Benchmark
      run: dotnet fsi build.fsx -p Benchmark

  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Init
      run: dotnet fsi build.fsx -p Init
    - name: Build documentation
      run: dotnet fsi build.fsx -p BuildDocs
    - name: Publish documentation
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output

  # The online tools build against main, and against the next major's branch for their preview.
  fantomas-tools:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v9.0')
    runs-on: ubuntu-latest
    steps:
    - name: Trigger the fantomas-tools build
      run: "curl -H 'Accept: application/vnd.github.everest-preview+json' -H 'Authorization: token ${{secrets.FANTOMAS_TOOLS_TOKEN}}' --request POST --data '{\"event_type\": \"fantomas-commit-on-main\"}' https://api.github.com/repos/fsprojects/fantomas-tools/dispatches"

  # Publishes the tool with Native AOT and runs its tests against that build. AOT compiles for the
  # machine it runs on, which is why every operating system gets a run of its own. Linux runs on the
  # Ubuntu the release builds on, so the tests run the executable that ships.
  aot:
    name: Native AOT
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Init
        run: dotnet fsi build.fsx -p Init
      - name: Test against Native AOT
        run: dotnet fsi build.fsx -p TestAot

  # The same on Alpine, whose C library is musl rather than glibc, for `fantomas.linux-musl-x64`.
  aot-musl:
    name: Native AOT (Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - name: Install what .NET and Native AOT need
        run: apk add --no-cache bash curl git icu-libs krb5-libs libgcc libintl libssl3 libstdc++ zlib clang build-base zlib-dev
      - uses: actions/checkout@v7.0.1
      - name: Trust the checkout
        # The container runs as root and the checkout belongs to the runner's user, and git refuses
        # a repository someone else owns. The build reads the commit from it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
      - name: Init
        run: dotnet fsi build.fsx -p Init
      - name: Test against Native AOT
        run: dotnet fsi build.fsx -p TestAot

  analyze:
    name: Analyze solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Run analyzers
        run: dotnet fsi build.fsx -- -p Analyze

      # always(), because the run this most wants to report on is the one that just failed.
      # Without it a finding at error severity would take the report down with it.
      - name: Upload merged SARIF
        if: always() && (github.event_name != 'push' || github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: analysis.sarif

  # Builds the project in a dev container
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and run dev container task
        uses: devcontainers/ci@v0.3
        with:
          runCmd: dotnet fsi build.fsx
