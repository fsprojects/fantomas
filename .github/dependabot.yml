version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Exclude major-version bumps to avoid breaking changes
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

